<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardHost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardStm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3c"/>
      <stop offset="100%" stop-color="#081a26"/>
    </linearGradient>
    <linearGradient id="cardKr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1537"/>
      <stop offset="100%" stop-color="#180b1e"/>
    </linearGradient>

    <!-- Glowing Lines -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="0" y1="150" x2="1400" y2="150"/>
    <line x1="0" y1="350" x2="1400" y2="350"/>
    <line x1="0" y1="550" x2="1400" y2="550"/>
    <line x1="0" y1="750" x2="1400" y2="750"/>
  </g>

  <!-- Title Header -->
  <text x="700" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">
    HIL GAS LEAK INJECTION &amp; CLOSED-LOOP COMPENSATION FLOW
  </text>
  <text x="700" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" text-anchor="middle">
    Hardware-in-the-Loop Real-Time Signal Chain: Host PyTest &gt; STM32H5 Plant &gt; AMD Kria KR260 DUT
  </text>

  <!-- ========================================================================= -->
  <!-- 1. LEFT COLUMN: HOST PC (PYTEST TESTBENCH) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 130)">
    <rect width="320" height="680" rx="16" fill="url(#cardHost)" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
    <rect width="320" height="50" rx="16" fill="#0284c7" opacity="0.3"/>
    <text x="160" y="32" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      1. Host PC (PyTest Controller)
    </text>

    <!-- Step 1 Box -->
    <rect x="20" y="70" width="280" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="95" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">STEP 1: Start Procedure</text>
    <rect x="35" y="105" width="250" height="28" rx="5" fill="#0f172a"/>
    <text x="45" y="124" fill="#a5f3fc" font-family="Courier, monospace" font-size="12">hil button start</text>
    <text x="35" y="155" fill="#94a3b8" font-family="sans-serif" font-size="11">Doctor enters patient GI tract</text>
    <text x="35" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11">System in Armed Normal Inspection</text>

    <!-- Step 2 Box (Injection) -->
    <rect x="20" y="215" width="280" height="145" rx="10" fill="#2d1515" stroke="#ef4444" stroke-width="2" filter="url(#glowRed)"/>
    <text x="35" y="240" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="800">STEP 2: INJECT GAS LEAK</text>
    <rect x="35" y="252" width="250" height="32" rx="5" fill="#180a0a"/>
    <text x="45" y="273" fill="#fca5a5" font-family="Courier, monospace" font-size="13" font-weight="bold">hil inject_leak 1</text>
    <text x="35" y="306" fill="#fecaca" font-family="sans-serif" font-size="11">• Simulates colon perforation / cuff leak</text>
    <text x="35" y="324" fill="#fecaca" font-family="sans-serif" font-size="11">• Chamber pressure drops rapidly</text>
    <text x="35" y="342" fill="#fecaca" font-family="sans-serif" font-size="11">• Injects acoustic hiss on DAC</text>

    <!-- Step 3 Box (Verification & Cleanup) -->
    <rect x="20" y="385" width="280" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="410" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">STEP 3: Verify &amp; Assertions</text>
    <text x="35" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="11">Polls Telemetry: <tspan fill="#67e8f9">hil status</tspan></text>
    <text x="35" y="452" fill="#a7f3d0" font-family="Courier, monospace" font-size="11">assert status['leak'] == True</text>
    <text x="35" y="472" fill="#a7f3d0" font-family="Courier, monospace" font-size="11">assert pump_duty &gt; 0.70</text>
    <text x="35" y="495" fill="#94a3b8" font-family="sans-serif" font-size="11">KR260 compensated successfully!</text>
    <text x="35" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="11">Cleanup: <tspan fill="#fca5a5">hil inject_leak 0</tspan></text>

    <!-- CSV Logging Box -->
    <rect x="20" y="560" width="280" height="95" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="35" y="585" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">CSV Test Report</text>
    <text x="35" y="605" fill="#38bdf8" font-family="Courier, monospace" font-size="10">reports/test_results.csv</text>
    <rect x="35" y="618" width="100" height="22" rx="4" fill="#065f46"/>
    <text x="85" y="633" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PASSED (0.7s)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CENTER COLUMN: STM32H563ZI (PLANT SIMULATOR) -->
  <!-- ========================================================================= -->
  <g transform="translate(440, 130)">
    <rect width="480" height="680" rx="16" fill="url(#cardStm)" stroke="#06b6d4" stroke-width="2" opacity="0.95"/>
    <rect width="480" height="50" rx="16" fill="#0891b2" opacity="0.3"/>
    <text x="240" y="32" fill="#22d3ee" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      2. STM32H563ZI Plant Simulator (Patient Lumen)
    </text>

    <!-- Module A: FSM State & Differential Equations -->
    <rect x="25" y="70" width="430" height="180" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <text x="40" y="95" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">A. GI Differential Equation Engine (10 ms cycle)</text>
    
    <rect x="40" y="108" width="400" height="42" rx="6" fill="#031f33"/>
    <text x="240" y="133" fill="#fef08a" font-family="Courier, monospace" font-size="13" font-weight="bold" text-anchor="middle">
      dP = (K_pump * PWM - K_leak * ΔP - K_vent * V) * dt
    </text>

    <text x="40" y="172" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">
      • Gas Leak Active (K_leak = 22.0 kPa/s):
    </text>
    <text x="55" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      Pressure drains from <tspan fill="#f87171" font-weight="bold">125.0 kPa &gt;&gt; 102.5 kPa</tspan> (Lumen Collapsing)
    </text>
    <text x="40" y="215" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">
      • FSM State Transition:
    </text>
    <text x="55" y="235" fill="#93c5fd" font-family="Courier, monospace" font-size="11">
      GI_STATE_STABLE_INSPECTION &gt;&gt; GI_STATE_LEAK_EVENT
    </text>

    <!-- Module B: 12-Bit DAC Audio Generator -->
    <rect x="25" y="270" width="430" height="150" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="40" y="295" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="700">B. 12-bit DAC1 Acoustic Leak Generator (Pin PA4)</text>
    <text x="40" y="318" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      16-Point Sinusoidal Look-Up Table (LUT) @ 3.0 kHz Hiss Sound
    </text>

    <!-- Simulated Sine Wave Graphic -->
    <path d="M 50,370 Q 75,340 100,370 T 150,370 T 200,370 T 250,370 T 300,370 T 350,370 T 400,370" 
          fill="none" stroke="#f43f5e" stroke-width="3" filter="url(#glowRed)"/>
    <rect x="50" y="390" width="370" height="20" rx="4" fill="#0f0e26"/>
    <text x="235" y="404" fill="#fda4af" font-family="sans-serif" font-size="10" text-anchor="middle">
      Analog Acoustic Waveform: 0.0V to 3.3V AC Signal streaming to KR260
    </text>

    <!-- Module C: I2C Target & PWM Capture -->
    <rect x="25" y="440" width="430" height="215" rx="10" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="40" y="465" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">C. Physical Peripherals &amp; Hardware Registers</text>
    
    <!-- I2C Target -->
    <rect x="40" y="480" width="400" height="60" rx="6" fill="#031f33" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="500" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">I2C Target 0x58 (PB8 SCL, PB9 SDA):</text>
    <text x="50" y="518" fill="#94a3b8" font-family="Courier, monospace" font-size="10">REG_STATUS: 0x01 (LEAK_BIT | AUDIO_BIT)</text>
    <text x="50" y="532" fill="#f87171" font-family="Courier, monospace" font-size="10">REG_PRESSURE: 0x0066 (102.5 kPa - Dropping fast!)</text>

    <!-- PWM DWT Capture -->
    <rect x="40" y="555" width="400" height="85" rx="6" fill="#031f33" stroke="#f97316" stroke-width="1"/>
    <text x="50" y="575" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="bold">Air Pump PWM Receiver (Pin PF15):</text>
    <text x="50" y="593" fill="#cbd5e1" font-family="sans-serif" font-size="10">DWT Cycle Counter EXTI Interrupt measures:</text>
    <text x="50" y="610" fill="#fbbf24" font-family="Courier, monospace" font-size="10">Normal Duty: 15.0% &gt;&gt; Compensated Duty: 80.0% (Boost!)</text>
    <text x="50" y="627" fill="#cbd5e1" font-family="sans-serif" font-size="10">Frequency: 9,765 Hz (Sub-microsecond accuracy)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RIGHT COLUMN: KRIA KR260 (DUT - DEVICE UNDER TEST) -->
  <!-- ========================================================================= -->
  <g transform="translate(980, 130)">
    <rect width="360" height="680" rx="16" fill="url(#cardKr)" stroke="#d946ef" stroke-width="2" opacity="0.95"/>
    <rect width="360" height="50" rx="16" fill="#c026d3" opacity="0.3"/>
    <text x="180" y="32" fill="#f0abfc" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      3. AMD Xilinx Kria KR260 (DUT)
    </text>

    <!-- Module: Vitis AI Acoustic Perception -->
    <rect x="20" y="70" width="320" height="160" rx="10" fill="#200d2b" stroke="#e879f9" stroke-width="1.5"/>
    <text x="35" y="95" fill="#f0abfc" font-family="sans-serif" font-size="14" font-weight="700">A. Vitis AI Acoustic Classifier</text>
    <text x="35" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11">Input: Audio ADC / Microphone In</text>
    
    <rect x="35" y="125" width="290" height="40" rx="6" fill="#14061c" stroke="#f43f5e" stroke-width="1"/>
    <text x="180" y="145" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      FFT &amp; CNN Spectral Inference:
    </text>
    <text x="180" y="158" fill="#f43f5e" font-family="Courier, monospace" font-size="11" font-weight="bold" text-anchor="middle">
      DETECTED_3KHZ_HISS = TRUE
    </text>
    <text x="35" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">Vision DPU confirms: <tspan fill="#fca5a5">GI_LUMEN_COLLAPSING</tspan></text>
    <text x="35" y="205" fill="#f0abfc" font-family="sans-serif" font-size="11" font-weight="bold">Output &gt;&gt; Flag LEAK_EVENT to PID Loop</text>

    <!-- Module: PetaLinux Closed-Loop PID -->
    <rect x="20" y="250" width="320" height="200" rx="10" fill="#200d2b" stroke="#f97316" stroke-width="2" filter="url(#glowOrange)"/>
    <text x="35" y="275" fill="#fdba74" font-family="sans-serif" font-size="14" font-weight="800">B. PetaLinux Closed-Loop PID</text>
    <text x="35" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11">Reads I2C Sensor Telemetry (/dev/i2c-1)</text>

    <!-- Error Math -->
    <rect x="35" y="308" width="290" height="48" rx="6" fill="#14061c"/>
    <text x="45" y="325" fill="#fdba74" font-family="Courier, monospace" font-size="11">Target Setpoint = 125.0 kPa</text>
    <text x="45" y="342" fill="#f87171" font-family="Courier, monospace" font-size="11">Current Sensor  = 102.5 kPa (Err: +22.5)</text>

    <text x="35" y="375" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">PID Decision &amp; Feedforward Boost:</text>
    <text x="35" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Error is high + Leak Detected</text>
    <text x="35" y="415" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">
      • PWM Output: <tspan fill="#f97316" font-size="14">15% &gt;&gt;&gt; 80.0% BOOST!</tspan>
    </text>
    <text x="35" y="435" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Solenoid Valve: Stays 3.3V (Hold)</text>

    <!-- Module: FPGA Hardware PWM Timer -->
    <rect x="20" y="470" width="320" height="185" rx="10" fill="#200d2b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="35" y="495" fill="#d8b4fe" font-family="sans-serif" font-size="14" font-weight="700">C. FPGA AXI PWM Core (PL Fabric)</text>
    <text x="35" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="11">Hardware AXI-Lite Timer Register: 0xA0000008</text>
    <rect x="35" y="528" width="290" height="40" rx="6" fill="#14061c"/>
    <text x="45" y="546" fill="#d8b4fe" font-family="Courier, monospace" font-size="11">PWM_DUTY = 819 / 1023 (80%)</text>
    <text x="45" y="560" fill="#94a3b8" font-family="sans-serif" font-size="10">Latency: &lt; 10 nanoseconds</text>
    <text x="35" y="590" fill="#cbd5e1" font-family="sans-serif" font-size="11">Physical Output on <tspan fill="#fb923c" font-weight="bold">PMOD1 Pin 1 (H12)</tspan></text>
    <text x="35" y="610" fill="#cbd5e1" font-family="sans-serif" font-size="11">Emergency Stop: Hardwired Gate Cutoff</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CROSS-BOARD HARDWARE WIRING BUSES (CONNECTING ARROWS) -->
  <!-- ========================================================================= -->

  <!-- 1. PyTest to STM32 (USB Serial Command) -->
  <path d="M 380,360 L 440,360" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="410" y="348" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">USB CDC</text>

  <!-- 2. STM32 DAC Audio to KR260 Audio In (PA4 -> Audio ADC) -->
  <path d="M 920,380 L 980,210" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="945" y="280" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-65 945,280)">
    PA4 &gt; Mic (3kHz Hiss)
  </text>

  <!-- 3. STM32 I2C to KR260 (PB8/PB9 -> PMOD0 I2C 0x58) -->
  <path d="M 920,510 L 980,370" fill="none" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="955" y="445" fill="#67e8f9" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-65 955,445)">
    I2C 0x58 (Pressure Drop)
  </text>

  <!-- 4. KR260 PWM to STM32 (PMOD1 Pin 1 -> PF15 PWM In) - THE FEEDBACK LOOP -->
  <path d="M 980,590 C 850,760 550,760 440,630" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrowOrange)" filter="url(#glowOrange)"/>
  <rect x="630" y="730" width="220" height="30" rx="6" fill="#1e1005" stroke="#f97316" stroke-width="1.5"/>
  <text x="740" y="750" fill="#fdba74" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    CLOSED-LOOP: BOOST PWM 80% (PF15)
  </text>

  <!-- Flow Status Pill Banner at Bottom -->
  <g transform="translate(250, 835)">
    <rect width="900" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="21" r="8" fill="#10b981"/>
    <text x="55" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">
      RESULT: Closed-loop latency &lt; 25ms | Patient lumen collapse prevented | HIL-TC-03 Passed
    </text>
  </g>
</svg>

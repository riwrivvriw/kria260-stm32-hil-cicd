# ==============================================================================
# Zephyr RTOS Project Configuration for STM32H5 HIL Simulator
# ==============================================================================

# 1. ระบบ Logging และ Printk
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# 2. ไดรเวอร์ I2C (รองรับทั้ง Controller/Master และ Target/Slave)
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_EEPROM_TARGET=y

# 3. ไดรเวอร์ GPIO (สำหรับตรวจวัดสัญญาณ PWM จาก KR260)
CONFIG_GPIO=y

# 4. Zephyr Shell Subsystem (สำหรับรับคำสั่งจาก Pytest บน Laptop ผ่าน USB)
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="hil:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_PRINTF_BUFF_SIZE=256

# 5. Multithreading & Timing
CONFIG_MULTITHREADING=y
